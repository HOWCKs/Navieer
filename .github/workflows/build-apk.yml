name: Build Android APK (Servo)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Navieer APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download Servo Android Embedding AAR
        run: |
          mkdir -p app/libs
          echo "Downloading official Servo Android AAR (ARM64)..."
          curl -fL --retry 5 --retry-delay 3 -o app/libs/servo-aarch64-android.aar "https://github.com/servo/servo/releases/download/v0.5.0/servo-aarch64-android.aar"
          echo "Patching minCompileSdk in AAR metadata for compatibility..."
          cd app/libs
          unzip -q servo-aarch64-android.aar -d aar_extracted
          if [ -f aar_extracted/META-INF/com/android/build/gradle/aar-metadata.properties ]; then
            sed -i 's/minCompileSdk=.*/minCompileSdk=34/g' aar_extracted/META-INF/com/android/build/gradle/aar-metadata.properties
            rm -f servo-aarch64-android.aar
            (cd aar_extracted && zip -q -r ../servo-aarch64-android.aar .)
            rm -rf aar_extracted
            echo "Successfully patched minCompileSdk in servo-aarch64-android.aar"
          fi
          cd ../..
          echo "Verifying downloaded AAR:"
          ls -lh app/libs/servo-aarch64-android.aar

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Navieer Release APK with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Save Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          tail -n 120 /tmp/build.log > build-failure.txt
          git add build-failure.txt
          git commit -m "debug: build failure log" || true
          git push -f origin debug-log || true

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" artifacts/Navieer-Servo-arm64-v8a.apk
          ls -lh artifacts/

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Navieer-Servo-arm64-v8a-apk
          path: artifacts/Navieer-Servo-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
